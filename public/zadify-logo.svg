<svg width="800" height="240" viewBox="0 0 800 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#090e17" />
    </linearGradient>

    <!-- Zadify Primary Emerald/Cyan Gradient -->
    <linearGradient id="zadify-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="45%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Upward Arrow Glow Gradient -->
    <linearGradient id="arrow-glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#A7F3D0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Slate Background Canvas -->
  <rect width="800" height="240" rx="24" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Logo Mark Icon Group (Centered Left) -->
  <g transform="translate(60, 40)">
    <!-- Outer Glow Circle -->
    <circle cx="80" cy="80" r="70" fill="#10B981" opacity="0.15" filter="url(#neon-glow)" />

    <!-- Hexagon Frame -->
    <rect x="10" y="10" width="140" height="140" rx="36" fill="#0D131C" stroke="url(#zadify-emerald)" stroke-width="4" stroke-opacity="0.6"/>

    <!-- Aerodynamic Z + Upward Ascension Arrow -->
    <g transform="translate(10, 10) scale(3.5)">
      <!-- Top Wing of Z -->
      <path d="M 9 11 C 9 9.895 9.895 9 11 9 L 29 9 C 29.8 9 30.3 9.8 29.9 10.5 L 25.5 16 H 18.5 L 24.2 9.8 C 24.5 9.4 24.2 9 23.7 9 L 11 9 Z" fill="url(#zadify-emerald)"/>
      
      <!-- Main Diagonal Shaft -->
      <path d="M 28 11.5 L 14.5 28.5 C 14.1 29 14.5 29.8 15.2 29.8 L 30 29.8 C 30.6 29.8 31 29.4 31 28.8 V 26 C 31 25.4 30.6 25 30 25 H 22 L 29.2 15.8 C 29.9 14.9 29.5 13.5 28.4 13.1 L 28 11.5 Z" fill="url(#zadify-emerald)"/>
      
      <!-- Upward Arrow Leveling Emblem -->
      <path d="M 17.5 13.5 L 22.5 19.5 H 19.5 V 25.5 H 15.5 V 19.5 H 12.5 L 17.5 13.5 Z" fill="url(#arrow-glow)" />
      
      <!-- Bottom Base Accent -->
      <path d="M 9 29 C 9 27.895 9.895 27 11 27 L 17 27 L 12.5 31 C 11.7 31.7 10.5 31.4 10.1 30.5 L 9 29 Z" fill="url(#zadify-emerald)" opacity="0.9"/>
      
      <!-- Digital Node Accent -->
      <circle cx="29" cy="10" r="1.5" fill="#A7F3D0"/>
      <circle cx="17.5" cy="13.5" r="1" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Typography Wordmark -->
  <text x="260" y="130" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="800" font-size="72" fill="url(#zadify-emerald)" letter-spacing="-2">Zadify</text>

  <!-- Tagline Text -->
  <text x="265" y="165" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="18" fill="#94A3B8" letter-spacing="0.5">Modern Islamic Productivity Super-App</text>
</svg>
